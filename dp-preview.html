<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anant Productions — Social Media DP Preview</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body {
      background: #0d0c0b;
      color: #fff;
      font-family: 'Montserrat', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }
    h1 {
      font-size: 1.8rem;
      margin-bottom: 8px;
      color: #D4AF37;
    }
    p {
      color: #888;
      font-size: 0.9rem;
      margin-bottom: 30px;
    }
    .preview-container {
      display: flex;
      flex-wrap: wrap;
      gap: 40px;
      justify-content: center;
      align-items: center;
    }
    .card {
      background: #181614;
      border: 1px solid rgba(212, 175, 55, 0.2);
      border-radius: 16px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .card h3 {
      font-size: 0.95rem;
      color: #D4AF37;
      margin-bottom: 16px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }
    .square-img {
      width: 320px;
      height: 320px;
      border-radius: 12px;
      object-fit: cover;
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
    }
    .circle-wrap {
      width: 240px;
      height: 240px;
      border-radius: 50%;
      overflow: hidden;
      border: 3px solid #D4AF37;
      box-shadow: 0 0 30px rgba(212, 175, 55, 0.3);
    }
    .circle-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .ig-mockup {
      width: 320px;
      background: #000;
      border-radius: 16px;
      border: 1px solid #222;
      padding: 20px;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .ig-avatar {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      padding: 2px;
      background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .ig-avatar img {
      width: 66px;
      height: 66px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #000;
    }
    .ig-text h4 {
      font-size: 0.9rem;
      margin-bottom: 4px;
    }
    .ig-text p {
      font-size: 0.75rem;
      color: #999;
      margin: 0;
    }
  </style>
</head>
<body>
  <h1>Social Media Profile DP</h1>
  <p>Optimized for Instagram (@anantproductions), WhatsApp Business & Facebook</p>

  <div class="preview-container">
    <div class="card">
      <h3>Full Square Master (1024x1024)</h3>
      <img src="anant_logo_social_dp.jpg" class="square-img" alt="Square DP">
    </div>

    <div class="card">
      <h3>Circular Avatar Crop (Safe Zone)</h3>
      <div class="circle-wrap">
        <img src="anant_logo_social_dp.jpg" alt="Circle Crop">
      </div>
    </div>

    <div class="card">
      <h3>Instagram Profile Preview</h3>
      <div class="ig-mockup">
        <div class="ig-avatar">
          <img src="anant_logo_social_dp.jpg" alt="IG Avatar">
        </div>
        <div class="ig-text">
          <h4>anantproductions</h4>
          <p>Anant Productions</p>
          <p style="color: #666; font-size: 0.7rem; margin-top: 2px;">Wedding Cinematography & Photography • Ahmedabad</p>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
