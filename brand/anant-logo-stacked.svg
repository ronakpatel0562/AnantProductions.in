<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="400" height="240" fill="none">
  <defs>
    <linearGradient id="anantGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5DF9E" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#AA821C" />
    </linearGradient>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&amp;family=Montserrat:wght@400;500;600&amp;display=swap');
      .title {
        font-family: 'Cinzel', serif;
        font-size: 32px;
        font-weight: 700;
        letter-spacing: 0.36em;
        fill: #FFFFFF;
        text-anchor: middle;
      }
      .subtitle {
        font-family: 'Montserrat', sans-serif;
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 0.52em;
        fill: #D4AF37;
        text-anchor: middle;
      }
      .tagline {
        font-family: 'Montserrat', sans-serif;
        font-size: 8px;
        font-weight: 500;
        letter-spacing: 0.28em;
        fill: #A39E93;
        text-anchor: middle;
      }
    </style>
  </defs>

  <!-- Centered Emblem Mark -->
  <g transform="translate(120, 10)">
    <path d="M 80 45 C 62 23, 34 23, 20 37 C 6 51, 6 69, 20 83 C 34 97, 62 97, 80 75" 
          transform="translate(0, -15)"
          stroke="url(#anantGold)" stroke-width="3.5" stroke-linecap="round" fill="none" />
    
    <path d="M 80 75 C 98 97, 126 97, 140 83 C 154 69, 154 51, 140 37 C 126 23, 98 23, 80 45" 
          transform="translate(0, -15)"
          stroke="url(#anantGold)" stroke-width="3.5" stroke-linecap="round" fill="none" />

    <g transform="translate(110, 45)">
      <circle cx="0" cy="0" r="16" stroke="url(#anantGold)" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.65" fill="none" />
      <line x1="-12" y1="-5" x2="-4" y2="13" stroke="url(#anantGold)" stroke-width="1.8" />
      <line x1="-4" y1="13" x2="13" y2="7" stroke="url(#anantGold)" stroke-width="1.8" />
      <line x1="13" y1="7" x2="11" y2="-10" stroke="url(#anantGold)" stroke-width="1.8" />
      <line x1="11" y1="-10" x2="-6" y2="-12" stroke="url(#anantGold)" stroke-width="1.8" />
      <circle cx="0" cy="0" r="3.5" fill="url(#anantGold)" />
    </g>

    <circle cx="80" cy="45" r="2.5" fill="url(#anantGold)" />
  </g>

  <!-- Typography Hierarchy -->
  <text x="206" y="142" class="title">ANANT</text>
  <text x="204" y="168" class="subtitle">PRODUCTIONS</text>
  
  <!-- Divider -->
  <line x1="170" y1="184" x2="230" y2="184" stroke="url(#anantGold)" stroke-width="1" opacity="0.7" />
  
  <!-- Tagline -->
  <text x="200" y="202" class="tagline">CINEMATOGRAPHY • PHOTOGRAPHY • AHMEDABAD</text>
</svg>
