<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>

  <!-- Open Graph / Meta -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://anantproductions.in/quote.html">

  <!-- Google Fonts: Geist, Cinzel, Noto Serif Gujarati, Playfair Display -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Geist+Mono:wght@400;500;600&family=Geist:wght@300;400;500;600;700&family=Noto+Serif+Gujarati:wght@400;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400;1,600&display=swap" rel="stylesheet">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="anant_logo.png">
  <link rel="apple-touch-icon" href="anant_logo.png">

  <!-- Prevent Flash of Unstyled Theme (FOUC) -->
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('anant_theme');
        if (saved === 'light' || (!saved && window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches)) {
          if (saved === 'light') {
            document.documentElement.setAttribute('data-theme', 'light');
          } else {
            document.documentElement.setAttribute('data-theme', 'dark');
          }
        } else {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      } catch (e) {}
    })();
  </script>

  <!-- Central Stylesheet -->
  <link rel="stylesheet" href="css/style.css?v=42">
  <!-- Professional Clean Routing & URL Normalizer -->
  <script>
    (function () {
      try {
        var p = window.location.pathname;
        if (p.endsWith('/index.html') || p === '/index.html' || p === 'index.html') {
          var clean = p.replace(/\/?index\.html\/?$/i, '/') || '/';
          window.history.replaceState(null, document.title, clean + window.location.search + window.location.hash);
        } else if (p.endsWith('.html')) {
          var clean = p.replace(/\.html$/i, '');
          window.history.replaceState(null, document.title, clean + window.location.search + window.location.hash);
        }
      } catch (e) {}
    })();
  </script>
</head>

  <!-- Central Configuration, Pricing Engine & Main JavaScript -->

</body>
</html>
